# Automatische Prüfung für Pull Requests (und main): Lint, Typecheck, Tests, Produktions-Build.
#
# Sicherheit:
# - Keine Secrets, keine Zugangsdaten: Shopify-Variablen sind ausdrücklich leer – die Shopify-Ansicht baut im
#   Modus „nicht eingerichtet“, Live-Abfragen gibt es ohnehin nur im lokalen Entwicklungsserver.
# - Nur Leserechte auf das Repository; der Checkout speichert keinen Token.
# - Tests sperren jeden Netzwerkzugriff (src/test/setup.ts) – Shopify-Schreibaufrufe sind dort unmöglich.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SHOPIFY_STORE_DOMAIN: ""
      SHOPIFY_CLIENT_ID: ""
      SHOPIFY_CLIENT_SECRET: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
